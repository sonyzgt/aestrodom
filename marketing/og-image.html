<!doctype html>
<!-- Source for public/og.png (1200×630). Rendered with headless Chrome; see scripts/make-brand-assets.mjs.
     Mirrors the desktop landing: Aestra in her suit behind the headline, logo and domain on top. -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #e8e9ee; color: #000; }
  body { position: relative; font-family: "Plus Jakarta Sans", sans-serif; }
  /* The 16:9 render covers the 1.9:1 card; anchored a little high so her face sits in the upper third. */
  .bg { position: absolute; inset: 0; background: url("../public/landing/aestra-suit.webp") center 30% / cover no-repeat; }
  /* Soft white wash on the left so the headline stays crisp over the scenery. */
  .wash { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(240,241,245,0.85) 0%, rgba(240,241,245,0.55) 30%, rgba(240,241,245,0) 48%); }
  header { position: absolute; left: 56px; right: 56px; top: 44px; display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; align-items: center; gap: 14px; font-family: Orbitron, sans-serif; font-weight: 900; font-size: 26px; letter-spacing: .15em; }
  .logo img { width: 36px; height: 36px; }
  .logo sup { font-size: 12px; margin-left: -10px; }
  .url { font-size: 15px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
  main { position: absolute; left: 56px; top: 168px; }
  .corner { width: 16px; height: 16px; display: block; }
  h1 { font-family: Orbitron, sans-serif; font-weight: 800; font-size: 66px; line-height: 1.05; letter-spacing: .08em; margin: 12px 0; }
  h1 span { display: flex; align-items: center; gap: 18px; }
  .checker { width: 84px; height: 42px; }
  .tag { position: absolute; right: 56px; bottom: 44px; padding: 18px 20px; background: rgba(240,241,245,0.82); backdrop-filter: blur(6px); font-size: 15px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; line-height: 1.7; }
  .tag svg { position: absolute; width: 12px; height: 12px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wash"></div>
  <header>
    <div class="logo"><img src="../public/logo.svg" alt="" />AESTRODOM<sup>˚</sup></div>
    <div class="url">aestrodom.org</div>
  </header>
  <main>
    <svg class="corner" viewBox="0 0 12 12" fill="none"><path d="M0 11.5V0.5H11.5" stroke="#000" stroke-width="1.5"/></svg>
    <h1>BUILD<br />ANYTHING<span>WITH AI
      <svg class="checker" viewBox="0 0 36 18">
        <g fill="#000">
          <rect x="0.35" y="0.35" width="3.8" height="3.8"/><rect x="9.35" y="0.35" width="3.8" height="3.8"/><rect x="18.35" y="0.35" width="3.8" height="3.8"/><rect x="27.35" y="0.35" width="3.8" height="3.8"/>
          <rect x="4.85" y="4.85" width="3.8" height="3.8"/><rect x="13.85" y="4.85" width="3.8" height="3.8"/><rect x="22.85" y="4.85" width="3.8" height="3.8"/><rect x="31.85" y="4.85" width="3.8" height="3.8"/>
          <rect x="0.35" y="9.35" width="3.8" height="3.8"/><rect x="9.35" y="9.35" width="3.8" height="3.8"/><rect x="18.35" y="9.35" width="3.8" height="3.8"/><rect x="27.35" y="9.35" width="3.8" height="3.8"/>
          <rect x="4.85" y="13.85" width="3.8" height="3.8"/><rect x="13.85" y="13.85" width="3.8" height="3.8"/><rect x="22.85" y="13.85" width="3.8" height="3.8"/><rect x="31.85" y="13.85" width="3.8" height="3.8"/>
        </g>
      </svg></span></h1>
    <svg class="corner" viewBox="0 0 12 12" fill="none"><path d="M0 0.5V11.5H11.5" stroke="#000" stroke-width="1.5"/></svg>
  </main>
  <div class="tag">
    <svg viewBox="0 0 12 12" fill="none" style="left:0;top:0"><path d="M0 11.5V0.5H11.5" stroke="#000" stroke-width="1.5"/></svg>
    <svg viewBox="0 0 12 12" fill="none" style="right:0;top:0"><path d="M0.5 0.5H11.5V11.5" stroke="#000" stroke-width="1.5"/></svg>
    <svg viewBox="0 0 12 12" fill="none" style="left:0;bottom:0"><path d="M0 0.5V11.5H11.5" stroke="#000" stroke-width="1.5"/></svg>
    <svg viewBox="0 0 12 12" fill="none" style="right:0;bottom:0"><path d="M0.5 11.5H11.5V0.5" stroke="#000" stroke-width="1.5"/></svg>
    Describe it.<br />Live on its own domain.
  </div>
</body>
</html>
