# Local development dependencies. The app itself runs with `npm run dev` on the host.
name: prismatic-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prismatic
      POSTGRES_PASSWORD: prismatic
      POSTGRES_DB: prismatic
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg_dev:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

volumes:
  pg_dev: {}
